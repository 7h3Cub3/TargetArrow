name: Build and Release TargetArrow

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Lua syntax and run tests
        run: |
          luac5.1 -p targetarrow.lua
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and verify addon ZIP
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/package_release.py --output-dir dist --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/package_release.py --output-dir dist
          fi
          python3 tests/test_package.py --dist-dir dist

      - name: Upload single addon ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TargetArrow-Addon
          path: dist/TargetArrow-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish addon ZIP and inline release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ZIP="dist/TargetArrow-${TAG}.zip"
          test -f "$ZIP"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "TargetArrow $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$ZIP" --title "TargetArrow $TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi

          # GitHub automatically provides source archives; a separate source ZIP is not needed.
          OLD_SOURCE="TargetArrow-Source-${TAG}.zip"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$OLD_SOURCE"; then
            gh release delete-asset "$TAG" "$OLD_SOURCE" --yes
          fi
